name: Entrega contínua

# Fecha o caminho automático entre um `git push` na `main` e uma imagem publicada e
# implantada. Ver amassa-plataforma/01-ARQUITETURA.md §6 — a sequência de deploy e as
# armadilhas do build. Quatro portões encadeados por `needs`, nesta ordem:
# qualidade -> e2e -> imagem -> implantar. Um teste quebrado interrompe a fila antes de
# qualquer publicação.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancela uma execução em andamento quando outra começa na mesma ref — dois deploys
# simultâneos na mesma máquina é uma corrida sem vencedor.
concurrency:
  group: entrega-${{ github.ref }}
  cancel-in-progress: true

# Escopo mínimo: ler o conteúdo do repositório e escrever pacotes no GHCR. Nada além disso.
permissions:
  contents: read
  packages: write

env:
  IMAGEM_BASE: ghcr.io/${{ github.repository_owner }}/amassa

jobs:
  # Portão mais barato, roda primeiro: lint e testes unitários.
  qualidade:
    name: Qualidade — lint e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run verificar-acoes
      - run: npm test

  # Depende de `qualidade`. O Postgres de teste chega como service container do runner —
  # mesma imagem e versão do banco de produção (postgres:17-alpine), sem publicar porta para
  # fora do runner. O E2E roda só aqui, no GitHub Actions (D-10): o VPS não carrega peso
  # extra e o pipeline continua sendo o único portão antes da publicação.
  e2e:
    name: E2E contra a imagem real
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres_teste:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amassa_teste
          POSTGRES_PASSWORD: efemero_de_teste_sem_valor_real
          POSTGRES_DB: amassa_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amassa_teste -d amassa_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TESTE: postgresql://amassa_teste:efemero_de_teste_sem_valor_real@127.0.0.1:5432/amassa_teste
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci

      # Aplica o schema diretamente pelo módulo do Drizzle usado por trás do script de
      # migração, sem passar pelo alias de npm reservado à migração do banco de produção —
      # mantém este arquivo livre de qualquer menção ao comando que migra o banco real
      # (01-ARQUITETURA.md §8: migração é sempre manual, nunca pelo pipeline). Aqui o alvo é
      # só o Postgres de teste efêmero deste job.
      - name: Aplicar schema no banco de teste
        run: npx tsx db/migrate.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TESTE }}

      # Confere de fora — extensão, funções de data, trigger de atualizado_em e o papel
      # amassa_app com os grants certos — contra o mesmo banco de teste que o passo acima
      # acabou de migrar. DATABASE_URL_TESTE já vem do env do job; em CI (variável CI, que o
      # runner sempre define) o script não sobe outro banco, só reaplica a migração
      # (idempotente) e confere.
      - name: Conferir a base comum do banco (npm run test:migracoes)
        run: npm run test:migracoes

      # Roda backup.sh e restaurar.sh de ponta a ponta DENTRO do service container acima —
      # scripts/testar-backup.mjs descobre o nome real do contêiner pela imagem
      # (postgres:17-alpine) em vez de supor um nome fixo que o runner não garante. Custo baixo
      # (o runner já tem Docker e o banco de teste no ar) para um backup que não apodrece em
      # silêncio entre uma fase e outra.
      - name: Provar backup e restauração de ponta a ponta (npm run test:backup)
        run: npm run test:backup

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      # A imagem testada aqui é a MESMA que o job `imagem` publica logo depois — mesmo
      # Dockerfile, mesmo alvo `app`, mesmo entrypoint (`node server.js` da saída
      # `standalone`). Testar com `next start` validaria um processo diferente do que sobe em
      # produção — "next start" nem é compatível com `output: "standalone"` (o Next avisa e
      # ignora a saída standalone). Ver a seção "Deviations" do SUMMARY deste plano.
      - name: Build da imagem app (mesmo Dockerfile do job imagem, sem publicar)
        run: |
          docker build \
            --target app \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            -t amassa-app:e2e \
            -f docker/Dockerfile .

      # --network host: o contêiner enxerga o Postgres do runner em 127.0.0.1:5432 do mesmo
      # jeito que os passos deste job enxergam, e a porta 3000 fica exposta direto para o
      # Playwright rodar sem publicação extra.
      - name: Subir o contêiner da imagem app
        # AUTH_SECRET e AUTH_TRUST_HOST exercitados aqui, contra a imagem real, pelo mesmo
        # motivo do playwright.config.ts local: sem AUTH_TRUST_HOST=true o Auth.js ignora
        # X-Forwarded-* atrás de proxy reverso e falha só em produção (01-ARQUITETURA.md §6).
        # O valor de AUTH_SECRET aqui é efêmero e descartável, só para este job.
        run: |
          docker run -d --name amassa_app_e2e --network host \
            -e DATABASE_URL="${{ env.DATABASE_URL_TESTE }}" \
            -e AUTH_SECRET="segredo-de-teste-efemero-sem-valor-real" \
            -e AUTH_TRUST_HOST="true" \
            -e PORT=3000 \
            amassa-app:e2e

      - name: Esperar /api/health responder
        run: |
          for tentativa in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Contêiner app respondendo."
              exit 0
            fi
            sleep 1
          done
          echo "Contêiner app não respondeu a tempo." >&2
          docker logs amassa_app_e2e || true
          exit 1

      # playwright.config.ts está com `reuseExistingServer: true`: como já existe um servidor
      # respondendo em http://127.0.0.1:3000 (o contêiner acima), o Playwright reaproveita e
      # NUNCA chega a rodar o comando de fallback `npm run build && npm run start`.
      - name: Rodar Playwright contra o contêiner
        run: npx playwright test

      # Sem estes dois passos o pipeline falha CEGO: quando o Playwright reprovava, restavam
      # so as mensagens de assercao no log, sem o que a pagina de fato mostrou e sem o log do
      # servidor. Diagnosticar exigia adivinhar ou reproduzir o ambiente do runner a mao.
      # `if: failure()` — nao guardam nada quando esta tudo verde.
      - name: Log do contêiner app (só quando o e2e falha)
        if: failure()
        run: docker logs amassa_app_e2e || true

      - name: Guardar os artefatos do Playwright (só quando o e2e falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Derrubar o contêiner da imagem app
        if: always()
        run: docker rm -f amassa_app_e2e || true

  # Depende de `e2e`. Publica duas tags a partir do mesmo Dockerfile: o alvo `app` e o alvo
  # `ferramentas`. NEXT_PUBLIC_SITE_URL entra como build-arg — é embutida no JavaScript
  # durante o `next build`, nunca lida em tempo de execução; tratá-la como variável de
  # runtime faria tudo funcionar em localhost e falhar em produção, porque a imagem nasce
  # aqui e o .env vive no VPS. Nenhum segredo de runtime (conexão com o banco, chave de
  # sessão) aparece em lugar nenhum deste job — esses vivem só no .env do servidor.
  imagem:
    name: Publicar imagens no GHCR
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR com o token efêmero do runner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicar imagem app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          push: true
          tags: ${{ env.IMAGEM_BASE }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e publicar imagem ferramentas
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ferramentas
          push: true
          tags: ${{ env.IMAGEM_BASE }}:ferramentas
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Depende de `imagem` e só roda quando a variável de repositório DEPLOY_ATIVO vale "true" —
  # o dono liga isso no plano 01-07, depois de preparar o servidor. Antes disso, este job
  # aparece pulado (skipped), nunca vermelho, porque o VPS ainda não existe.
  #
  # Sem `docker login` aqui: o package do GHCR é público (D-07), o VPS baixa a imagem sem
  # autenticar em registro nenhum. Nenhuma migração roda neste job nem em nenhum outro deste
  # arquivo — migração é aplicada à mão, depois de um backup, por alguém que está olhando.
  implantar:
    name: Implantar no VPS
    needs: imagem
    if: vars.DEPLOY_ATIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Necessário para o passo que ressincroniza o compose.yml: sem checkout, este job não tem
      # o arquivo. Os demais passos só precisam de ssh, mas o custo aqui é de segundos.
      - uses: actions/checkout@v4

      # A chave viaja por copiar-e-colar de um terminal para a tela de secrets do GitHub, e é
      # nesse trajeto que ela costuma se corromper: uma linha que quebra, um retorno de carro
      # do Windows, a linha -----END----- que fica de fora. O sintoma nativo disso é
      # "error in libcrypto" no meio do ssh, que não diz nada sobre a causa. Este passo aceita
      # os dois formatos e, se a chave estiver inválida, para aqui com uma mensagem que
      # explica o que fazer.
      - name: Configurar chave SSH
        run: |
          install -d -m 700 ~/.ssh
          CHAVE='${{ secrets.VPS_SSH_CHAVE }}'

          if printf '%s' "$CHAVE" | grep -q 'BEGIN .*PRIVATE KEY'; then
            # Formato normal, com as linhas BEGIN/END. Remove retornos de carro do Windows.
            printf '%s\n' "$CHAVE" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            # Linha única: assume base64 do arquivo inteiro. É o formato recomendado no
            # roteiro justamente por não ter como quebrar linha no meio.
            printf '%s' "$CHAVE" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_ed25519 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::O secret VPS_SSH_CHAVE não contém uma chave privada SSH válida."
            echo "A chave provavelmente se corrompeu ao ser copiada do terminal (linha quebrada,"
            echo "retorno de carro do Windows, ou a linha -----END----- faltando)."
            echo "Refaça o secret seguindo docs/operacao/01-preparar-servidor.md, passo 9 —"
            echo "ele agora usa base64 em linha única, que não tem como quebrar no caminho."
            exit 1
          fi
          echo "Chave privada válida. Impressão digital da pública correspondente:"
          ssh-keygen -y -f ~/.ssh/id_ed25519 | ssh-keygen -lf -

          if ! ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::ssh-keyscan não obteve a chave de host de VPS_HOST."
            echo "Confira se o secret VPS_HOST tem o endereço certo e se a porta 22 aceita conexão."
            exit 1
          fi
          test -s ~/.ssh/known_hosts || { echo "::error::known_hosts vazio — VPS_HOST não respondeu."; exit 1; }

      # O compose.yml do servidor era colocado uma única vez, por scp, no Roteiro 1 — e nunca
      # mais. Quando `docker/compose.yml` mudou no repositório (o serviço `ferramentas` passou a
      # usar DATABASE_URL_MIGRACAO no commit e593e83, plano 02a-02), a cópia do servidor ficou
      # para trás em silêncio: nada quebra até alguém tentar migrar, e aí o `ferramentas` conecta
      # com o papel errado e o Postgres recusa com "permission denied for database". Custou meia
      # hora de diagnóstico na migração da Fase 3 (WINDOWS.md id 14). O `.env` NUNCA é tocado
      # aqui — ele é do servidor, tem segredos, e é o dono quem o edita.
      - name: Ressincronizar o compose.yml do servidor
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            docker/compose.yml \
            "${{ secrets.VPS_USUARIO }}@${{ secrets.VPS_HOST }}:/opt/amassa/compose.yml"

      # O nome do serviço é obrigatório: `up -d` sem ele recria todos os contêineres
      # declarados, inclusive o postgres — e é exatamente isso que INFRA-06 proíbe.
      #
      # `pull ferramentas` junto com `pull app`: a imagem de ferramentas é publicada pelo job
      # `imagem` mas nunca era baixada aqui, e `docker compose run` usa o cache local sem
      # consultar o registro. O servidor rodou desde a Fase 2a com a imagem de ferramentas
      # daquela época — as migrações de qualquer fase seguinte simplesmente não existiam dentro
      # dela (WINDOWS.md id 13). Pull só baixa; nenhum contêiner de ferramentas sobe aqui, e
      # nenhuma migração roda no pipeline — isso continua sendo à mão, depois de um backup.
      - name: Publicar — pull e up nomeando o serviço app
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USUARIO }}@${{ secrets.VPS_HOST }}" '
              cd /opt/amassa &&
              docker compose pull app &&
              docker compose --profile ferramentas pull ferramentas &&
              docker compose up -d app
            '

      - name: Verificar /api/health pelo domínio
        run: |
          for tentativa in $(seq 1 10); do
            if curl -sf https://amassacerrado.com.br/api/health > /dev/null; then
              echo "Produção respondendo."
              exit 0
            fi
            sleep 3
          done
          echo "Produção não respondeu a tempo." >&2
          exit 1
