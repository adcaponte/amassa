name: Entrega contínua

# Fecha o caminho automático entre um `git push` na `main` e uma imagem publicada e
# implantada. Ver amassa-plataforma/01-ARQUITETURA.md §6 — a sequência de deploy e as
# armadilhas do build. Portões encadeados por `needs`, nesta fila (desde 06/10/2026, plano
# 06.5-22, D-22 — antes eram quatro em fila: qualidade -> e2e -> imagem -> implantar):
#
#   qualidade ∥ construir  ->  e2e (desktop) ∥ e2e (celular) ∥ banco  ->  publicar  ->  implantar
#
# - `construir` monta a imagem UMA vez (com cache) e a sobe ao GHCR só com a tag do commit
#   (`:<sha>` e `:ferramentas-<sha>`) — nenhuma dessas tags é implantada;
# - as duas fatias do e2e baixam e testam ESSA imagem; `banco` prova migrações e backup;
# - `publicar` não monta nada: só dá às mesmas imagens as tags `:latest` e `:ferramentas`, que são
#   as que o servidor baixa. O pipeline publica a mesma imagem que testou.
#
# Um teste quebrado interrompe a fila antes de `:latest` mudar.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancela uma execução em andamento quando outra começa na mesma ref — dois deploys
# simultâneos na mesma máquina é uma corrida sem vencedor.
concurrency:
  group: entrega-${{ github.ref }}
  cancel-in-progress: true

# Escopo mínimo: ler o conteúdo do repositório e escrever pacotes no GHCR. Nada além disso.
permissions:
  contents: read
  packages: write

env:
  IMAGEM_BASE: ghcr.io/${{ github.repository_owner }}/amassa

jobs:
  # Portão mais barato, roda primeiro: lint e testes unitários.
  qualidade:
    name: Qualidade — lint e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run verificar-acoes
      - run: npm test

  # Fase 06.5 (D-22, P5): a imagem é montada AQUI, uma vez, e em paralelo com `qualidade` (sem
  # `needs`) — ganha os minutos do build enquanto o lint e os unitários rodam. Antes ela era montada
  # duas vezes: um `docker build` sem cache dentro do e2e e outro no job de publicar, depois dos
  # testes — a imagem publicada NÃO era o mesmo artefato que o e2e tinha testado, só o mesmo
  # Dockerfile.
  #
  # As tags daqui são só as do commit (`:<sha>`, `:ferramentas-<sha>`). Publicá-las antes do lint é
  # seguro: o servidor só baixa `:latest`/`:ferramentas` (o `.env` do VPS não muda), e essas só
  # mudam em `publicar`, depois de e2e e banco verdes. A tag do commit serve para rastrear qual
  # imagem cada run testou e para voltar uma versão à mão.
  #
  # NEXT_PUBLIC_SITE_URL entra como build-arg — é embutida no JavaScript durante o `next build`,
  # nunca lida em tempo de execução; tratá-la como variável de runtime faria tudo funcionar em
  # localhost e falhar em produção, porque a imagem nasce aqui e o .env vive no VPS. Nenhum
  # segredo de runtime (conexão com o banco, chave de sessão) aparece em lugar nenhum deste job —
  # esses vivem só no .env do servidor.
  #
  # Cache `gha` com um escopo por alvo: antes os dois alvos gravavam no MESMO escopo padrão, e o
  # segundo `cache-to` sobrescrevia o primeiro. O primeiro run depois desta mudança parte de cache
  # frio (escopos novos); do segundo em diante, só as camadas que mudaram são refeitas.
  construir:
    name: Construir a imagem (tag do commit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR com o token efêmero do runner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e subir a imagem app com a tag do commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          push: true
          tags: ${{ env.IMAGEM_BASE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Construir e subir a imagem ferramentas com a tag do commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ferramentas
          push: true
          tags: ${{ env.IMAGEM_BASE }}:ferramentas-${{ github.sha }}
          cache-from: type=gha,scope=ferramentas
          cache-to: type=gha,scope=ferramentas,mode=max

  # Depende de `qualidade` e de `construir`. O Postgres de teste chega como service container do runner —
  # mesma imagem e versão do banco de produção (postgres:17-alpine), sem publicar porta para
  # fora do runner. O E2E roda só aqui, no GitHub Actions (D-10): o VPS não carrega peso
  # extra e o pipeline continua sendo o único portão antes da publicação.
  #
  # Fase 06.5 (D-22, P5): o job virou uma MATRIZ de dois jobs paralelos, um por fatia da suíte —
  # `desktop` e `celular` —, cada um com o seu Postgres efêmero (o `services` abaixo vale por job da
  # matriz) e o seu contêiner. `E2E_FATIA` (playwright.config.ts, `projetosDaFatia`) escolhe a metade:
  # cada fatia roda a cadeia do vazio + o seu projeto + os `parametros-*` dela. Juntas, as duas cobrem
  # exatamente a suíte de antes (conferido por `--list` no plano 06.5-22). `fail-fast: false`: uma
  # fatia vermelha não cancela a outra — o log das duas é o que diz se o defeito é de um viewport só.
  e2e:
    name: E2E (${{ matrix.fatia }}) contra a imagem real
    needs: [qualidade, construir]
    strategy:
      fail-fast: false
      matrix:
        fatia: [desktop, celular]
    runs-on: ubuntu-latest
    # 25, não 15: a suíte chegou a 804 testes na Fase 04.5 e o runner roda com 2 workers (metade
    # dos núcleos), não os 8 da máquina de desenvolvimento. O run do commit `bb39df4` foi
    # CANCELADO por tempo aos 15min16s, tendo chegado ao teste 781 de 804 — e um job cancelado
    # não publica imagem nem implanta, então o limite apertado transforma lentidão em bloqueio
    # de entrega sem dizer o porquê.
    #
    # Contam contra o tempo, além do tamanho: `retries: 2` (playwright.config.ts) faz cada
    # falha custar TRÊS execuções, e os dois primeiros minutos vão em build da imagem, migração
    # e semeadura antes do primeiro teste.
    #
    # 25 é folga, não conforto: se um dia encostar de novo, o problema é a suíte, não o número —
    # dividir o job por projeto antes de subir este valor outra vez.
    #
    # 03/10/2026: ENCOSTOU. Com as Fases 06.2 e 06.3 a suíte passou a 1459 testes; os runs
    # 37127538506 e 37130697961 foram cancelados pelo tempo no teste ~1325 (22,5 min só de Playwright,
    # medido no log). Subido para 40 para publicar as duas fases; a divisão do job por projeto
    # (desktop / celular) continua sendo a correção de verdade — tarefa aberta no STATE.
    # 04/10/2026: a Fase 06.4 (Queimas) acrescentou ~10,7% de tempo de teste; a estimativa no CI ficou em
    # 30–35 min, sem folga para retries contra os 40. Subido para 50 (decisão do dono: "pode subir como
    # for melhor"). A divisão do job por projeto continua anotada no Polimento.
    # 06/10/2026 (plano 06.5-22, D-22): a divisão foi feita — cada job da matriz roda 897 dos 1714
    # testes (a cadeia do vazio, 80 testes, roda nas duas fatias; o resto se divide ao meio). Pela
    # taxa medida em 03/10 (~1325 testes em 22,5 min de Playwright, ~1 s por teste com 2 workers),
    # 897 testes dão ~15–18 min de Playwright por fatia, mais uns 3 min de preparo (npm ci,
    # navegador, imagem, migração). 35 deixa folga para os
    # `retries` sem voltar a esconder uma suíte que cresce: se uma fatia encostar nos 35, o
    # problema volta a ser o tamanho da suíte, não o número. A primeira medida real é o run do
    # push do dono (portão 06.5-30).
    timeout-minutes: 35
    services:
      postgres_teste:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amassa_teste
          POSTGRES_PASSWORD: efemero_de_teste_sem_valor_real
          POSTGRES_DB: amassa_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amassa_teste -d amassa_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TESTE: postgresql://amassa_teste:efemero_de_teste_sem_valor_real@127.0.0.1:5432/amassa_teste
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci

      # Aplica o schema diretamente pelo módulo do Drizzle usado por trás do script de
      # migração, sem passar pelo alias de npm reservado à migração do banco de produção —
      # mantém este arquivo livre de qualquer menção ao comando que migra o banco real
      # (01-ARQUITETURA.md §8: migração é sempre manual, nunca pelo pipeline). Aqui o alvo é
      # só o Postgres de teste efêmero deste job.
      - name: Aplicar schema no banco de teste
        run: npx tsx db/migrate.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TESTE }}

      # `test:migracoes` e `test:backup` moravam aqui, entre a migração e o Playwright. Desde o plano
      # 06.5-22 eles rodam no job `banco`, em paralelo com as duas fatias — repeti-los nos dois jobs
      # da matriz seria pagar duas vezes pela mesma prova.

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      # A imagem testada aqui é a MESMA que o job `publicar` promove a `:latest` logo depois — não
      # outra montagem do mesmo Dockerfile, o MESMO artefato, pela tag do commit que `construir`
      # acabou de subir (D-22). Mesmo alvo `app`, mesmo entrypoint (`node server.js` da saída
      # `standalone`). Testar com `next start` validaria um processo diferente do que sobe em
      # produção — "next start" nem é compatível com `output: "standalone"` (o Next avisa e
      # ignora a saída standalone). Ver a seção "Deviations" do SUMMARY do plano 01-05.
      #
      # Sem `docker login`: o pacote do GHCR é público (D-07), como para o VPS.
      - name: Baixar a imagem app do commit (a que `construir` montou)
        run: docker pull "${{ env.IMAGEM_BASE }}:${{ github.sha }}"

      # --network host: o contêiner enxerga o Postgres do runner em 127.0.0.1:5432 do mesmo
      # jeito que os passos deste job enxergam, e a porta 3000 fica exposta direto para o
      # Playwright rodar sem publicação extra.
      - name: Subir o contêiner da imagem app
        # AUTH_SECRET e AUTH_TRUST_HOST exercitados aqui, contra a imagem real, pelo mesmo
        # motivo do playwright.config.ts local: sem AUTH_TRUST_HOST=true o Auth.js ignora
        # X-Forwarded-* atrás de proxy reverso e falha só em produção (01-ARQUITETURA.md §6).
        # O valor de AUTH_SECRET aqui é efêmero e descartável, só para este job.
        run: |
          docker run -d --name amassa_app_e2e --network host \
            -e DATABASE_URL="${{ env.DATABASE_URL_TESTE }}" \
            -e AUTH_SECRET="segredo-de-teste-efemero-sem-valor-real" \
            -e AUTH_TRUST_HOST="true" \
            -e PORT=3000 \
            "${{ env.IMAGEM_BASE }}:${{ github.sha }}"

      - name: Esperar /api/health responder
        run: |
          for tentativa in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Contêiner app respondendo."
              exit 0
            fi
            sleep 1
          done
          echo "Contêiner app não respondeu a tempo." >&2
          docker logs amassa_app_e2e || true
          exit 1

      # playwright.config.ts está com `reuseExistingServer: true`: como já existe um servidor
      # respondendo em http://127.0.0.1:3000 (o contêiner acima), o Playwright reaproveita e
      # NUNCA chega a rodar o comando de fallback `npm run build && npm run start`.
      # `E2E_FATIA` escolhe a metade da suíte deste job da matriz (playwright.config.ts). Um valor
      # fora de `desktop`/`celular` derruba a carga da config com erro — nunca roda zero testes verde.
      - name: Rodar Playwright contra o contêiner (fatia ${{ matrix.fatia }})
        run: npx playwright test
        env:
          E2E_FATIA: ${{ matrix.fatia }}

      # Sem estes dois passos o pipeline falha CEGO: quando o Playwright reprovava, restavam
      # so as mensagens de assercao no log, sem o que a pagina de fato mostrou e sem o log do
      # servidor. Diagnosticar exigia adivinhar ou reproduzir o ambiente do runner a mao.
      # `if: failure()` — nao guardam nada quando esta tudo verde.
      - name: Log do contêiner app (só quando o e2e falha)
        if: failure()
        run: docker logs amassa_app_e2e || true

      - name: Guardar os artefatos do Playwright (só quando o e2e falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Um nome por fatia: dois jobs da matriz enviando o MESMO nome colidem no upload-artifact@v4.
          name: playwright-falhas-${{ matrix.fatia }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Derrubar o contêiner da imagem app
        if: always()
        run: docker rm -f amassa_app_e2e || true

  # Fase 06.5 (D-22): as duas provas do banco que moravam no job `e2e`, num job próprio, em paralelo
  # com as duas fatias do e2e. Mesmo serviço Postgres efêmero (postgres:17-alpine, a imagem e a versão
  # de produção), mesma migração do banco de teste, os mesmos dois scripts, na mesma ordem.
  banco:
    name: Banco — migrações e backup de ponta a ponta
    needs: qualidade
    runs-on: ubuntu-latest
    # Os dois scripts levavam poucos minutos dentro do job `e2e` (npm ci + migração + as provas em
    # bancos próprios do test:migracoes + o backup/restauração). 15 é folga larga para isso.
    timeout-minutes: 15
    services:
      postgres_teste:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amassa_teste
          POSTGRES_PASSWORD: efemero_de_teste_sem_valor_real
          POSTGRES_DB: amassa_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amassa_teste -d amassa_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TESTE: postgresql://amassa_teste:efemero_de_teste_sem_valor_real@127.0.0.1:5432/amassa_teste
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci

      # O mesmo passo do job `e2e` (e o mesmo porquê: o módulo do Drizzle direto, sem o alias de npm
      # reservado ao banco real — este arquivo continua sem nenhuma menção a ele). Alvo: só o
      # Postgres efêmero deste job.
      - name: Aplicar schema no banco de teste
        run: npx tsx db/migrate.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TESTE }}

      # Confere de fora — extensão, funções de data, trigger de atualizado_em e o papel
      # amassa_app com os grants certos — contra o mesmo banco de teste que o passo acima
      # acabou de migrar. DATABASE_URL_TESTE já vem do env do job; em CI (variável CI, que o
      # runner sempre define) o script não sobe outro banco, só reaplica a migração
      # (idempotente) e confere.
      - name: Conferir a base comum do banco (npm run test:migracoes)
        run: npm run test:migracoes

      # Roda backup.sh e restaurar.sh de ponta a ponta DENTRO do service container acima —
      # scripts/testar-backup.mjs descobre o nome real do contêiner pela imagem
      # (postgres:17-alpine) em vez de supor um nome fixo que o runner não garante. Custo baixo
      # (o runner já tem Docker e o banco de teste no ar) para um backup que não apodrece em
      # silêncio entre uma fase e outra.
      - name: Provar backup e restauração de ponta a ponta (npm run test:backup)
        run: npm run test:backup

  # Depende de `e2e` (as duas fatias) e de `banco`. NÃO monta imagem nenhuma (D-22): só dá às
  # imagens que `construir` subiu com a tag do commit — e que as duas fatias do e2e baixaram e
  # testaram — as tags que o servidor baixa, `:latest` e `:ferramentas`.
  # O `imagetools` do buildx copia o manifesto no próprio registro: o conteúdo (digest) de
  # `:latest` passa a ser exatamente o de `:<sha>`, sem nenhum build entre o teste e a publicação.
  # Se um teste reprovou, este job não roda e `:latest` continua a imagem do último run verde.
  publicar:
    name: Publicar as imagens testadas no GHCR
    needs: [e2e, banco]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR com o token efêmero do runner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promover a imagem app testada a :latest
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGEM_BASE }}:latest" \
            "${{ env.IMAGEM_BASE }}:${{ github.sha }}"

      - name: Promover a imagem ferramentas do mesmo commit a :ferramentas
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGEM_BASE }}:ferramentas" \
            "${{ env.IMAGEM_BASE }}:ferramentas-${{ github.sha }}"

      # O que foi publicado, pelo digest — é a linha a comparar com o `docker images --digests` do
      # servidor se um dia houver dúvida sobre qual imagem está no ar.
      - name: Conferir os digests publicados
        run: |
          docker buildx imagetools inspect "${{ env.IMAGEM_BASE }}:latest"
          docker buildx imagetools inspect "${{ env.IMAGEM_BASE }}:ferramentas"

  # Depende de `publicar` e só roda quando a variável de repositório DEPLOY_ATIVO vale "true" —
  # o dono liga isso no plano 01-07, depois de preparar o servidor. Antes disso, este job
  # aparece pulado (skipped), nunca vermelho, porque o VPS ainda não existe.
  #
  # Sem `docker login` aqui: o package do GHCR é público (D-07), o VPS baixa a imagem sem
  # autenticar em registro nenhum. Nenhuma migração roda neste job nem em nenhum outro deste
  # arquivo — migração é aplicada à mão, depois de um backup, por alguém que está olhando.
  implantar:
    name: Implantar no VPS
    needs: publicar
    if: vars.DEPLOY_ATIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Necessário para o passo que ressincroniza o compose.yml: sem checkout, este job não tem
      # o arquivo. Os demais passos só precisam de ssh, mas o custo aqui é de segundos.
      - uses: actions/checkout@v4

      # A chave viaja por copiar-e-colar de um terminal para a tela de secrets do GitHub, e é
      # nesse trajeto que ela costuma se corromper: uma linha que quebra, um retorno de carro
      # do Windows, a linha -----END----- que fica de fora. O sintoma nativo disso é
      # "error in libcrypto" no meio do ssh, que não diz nada sobre a causa. Este passo aceita
      # os dois formatos e, se a chave estiver inválida, para aqui com uma mensagem que
      # explica o que fazer.
      - name: Configurar chave SSH
        run: |
          install -d -m 700 ~/.ssh
          CHAVE='${{ secrets.VPS_SSH_CHAVE }}'

          if printf '%s' "$CHAVE" | grep -q 'BEGIN .*PRIVATE KEY'; then
            # Formato normal, com as linhas BEGIN/END. Remove retornos de carro do Windows.
            printf '%s\n' "$CHAVE" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            # Linha única: assume base64 do arquivo inteiro. É o formato recomendado no
            # roteiro justamente por não ter como quebrar linha no meio.
            printf '%s' "$CHAVE" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_ed25519 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::O secret VPS_SSH_CHAVE não contém uma chave privada SSH válida."
            echo "A chave provavelmente se corrompeu ao ser copiada do terminal (linha quebrada,"
            echo "retorno de carro do Windows, ou a linha -----END----- faltando)."
            echo "Refaça o secret seguindo docs/operacao/01-preparar-servidor.md, passo 9 —"
            echo "ele agora usa base64 em linha única, que não tem como quebrar no caminho."
            exit 1
          fi
          echo "Chave privada válida. Impressão digital da pública correspondente:"
          ssh-keygen -y -f ~/.ssh/id_ed25519 | ssh-keygen -lf -

          if ! ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::ssh-keyscan não obteve a chave de host de VPS_HOST."
            echo "Confira se o secret VPS_HOST tem o endereço certo e se a porta 22 aceita conexão."
            exit 1
          fi
          test -s ~/.ssh/known_hosts || { echo "::error::known_hosts vazio — VPS_HOST não respondeu."; exit 1; }

      # O compose.yml do servidor era colocado uma única vez, por scp, no Roteiro 1 — e nunca
      # mais. Quando `docker/compose.yml` mudou no repositório (o serviço `ferramentas` passou a
      # usar DATABASE_URL_MIGRACAO no commit e593e83, plano 02a-02), a cópia do servidor ficou
      # para trás em silêncio: nada quebra até alguém tentar migrar, e aí o `ferramentas` conecta
      # com o papel errado e o Postgres recusa com "permission denied for database". Custou meia
      # hora de diagnóstico na migração da Fase 3 (WINDOWS.md id 14). O `.env` NUNCA é tocado
      # aqui — ele é do servidor, tem segredos, e é o dono quem o edita.
      - name: Ressincronizar o compose.yml do servidor
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            docker/compose.yml \
            "${{ secrets.VPS_USUARIO }}@${{ secrets.VPS_HOST }}:/opt/amassa/compose.yml"

      # O nome do serviço é obrigatório: `up -d` sem ele recria todos os contêineres
      # declarados, inclusive o postgres — e é exatamente isso que INFRA-06 proíbe.
      #
      # `pull ferramentas` junto com `pull app`: a imagem de ferramentas era publicada pelo job
      # `imagem` (desde 06.5-22, `publicar` dá a tag `:ferramentas`) mas nunca era baixada aqui, e `docker compose run` usa o cache local sem
      # consultar o registro. O servidor rodou desde a Fase 2a com a imagem de ferramentas
      # daquela época — as migrações de qualquer fase seguinte simplesmente não existiam dentro
      # dela (WINDOWS.md id 13). Pull só baixa; nenhum contêiner de ferramentas sobe aqui, e
      # nenhuma migração roda no pipeline — isso continua sendo à mão, depois de um backup.
      - name: Publicar — pull e up nomeando o serviço app
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USUARIO }}@${{ secrets.VPS_HOST }}" '
              cd /opt/amassa &&
              docker compose pull app &&
              docker compose --profile ferramentas pull ferramentas &&
              docker compose up -d app
            '

      - name: Verificar /api/health pelo domínio
        run: |
          for tentativa in $(seq 1 10); do
            if curl -sf https://amassacerrado.com.br/api/health > /dev/null; then
              echo "Produção respondendo."
              exit 0
            fi
            sleep 3
          done
          echo "Produção não respondeu a tempo." >&2
          exit 1
