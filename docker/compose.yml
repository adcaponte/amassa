services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serve o site. Nunca publica porta no host — quem fala com o mundo é o Caddy.
  app:
    image: ${IMAGEM_APP}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Fotos de orçamento (Fase 04.5, D-27/D-30): bind mount, não volume nomeado. O
      # `scripts/backup.sh` roda NO HOST, fora de qualquer contêiner, e precisa alcançar este
      # diretório direto com o mesmo `rclone` que já copia o dump do Postgres — sem
      # `docker exec`, sem depender do caminho interno do driver de armazenamento do Docker
      # (que não é contrato estável). O lado esquerdo é o caminho aprovado pelo dono na Tarefa 1
      # do plano 03 (.planning/phases/04.5-financeiro-parte-2/04.5-CONTEXT.md, D-30); o
      # diretório em si e a posse (`chown 100:101`) são passo de roteiro
      # (docs/operacao/12-fotos-volume-e-backup.md), nunca deste arquivo nem do pipeline.
      - /opt/amassa/dados/fotos-orcamentos:/dados/fotos-orcamentos
    environment:
      # Papel amassa_app (sem posse de tabela, sem privilégio de definição de estrutura) —
      # nunca o dono do banco. Ver a migração custom que cria o papel e os grants
      # (02-MODELO-DE-DADOS.md §0) e docker/compose.yml serviço `ferramentas`, que usa o dono.
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      # Origem pública do site, para o Auth.js montar URLs absolutas. Sem ela, o redirecionamento
      # de quem não tem sessão saía como `/login?callbackUrl=https://0.0.0.0:3000/...` — o endereço
      # em que o servidor standalone ESCUTA dentro do contêiner, não o domínio (WINDOWS.md nº 2).
      # AUTH_TRUST_HOST não resolve isto: em next-auth 5.0.0-beta.32 o callbackUrl do middleware
      # sai de `reqWithEnvURL` (node_modules/next-auth/lib/env.js), que só reescreve a origem
      # quando AUTH_URL existe. Sem caminho no fim, ela não altera o basePath (`/api/auth`).
      # Padrão aqui, e não só no .env: este arquivo é ressincronizado pelo job `implantar`, o .env
      # não — uma variável que dependesse de edição à mão no servidor envelheceria em silêncio.
      # O .env ainda pode sobrescrever.
      AUTH_URL: ${AUTH_URL:-https://amassacerrado.com.br}
      # Caminho, DENTRO do contêiner, onde as fotos de orçamento moram (Fase 04.5, D-27) — lido
      # por `lib/orcamentos/caminho-fotos.ts`, sempre FORA de `/app` (a árvore que o Next serve
      # é só leitura; dado de cliente não mora junto do código). Valor padrão aqui, e não só no
      # `.env`, pelo mesmo motivo de AUTH_URL acima: este arquivo é ressincronizado pelo job
      # `implantar`, o `.env` não — uma variável que dependesse de edição à mão no servidor
      # envelheceria em silêncio.
      CAMINHO_FOTOS: ${CAMINHO_FOTOS:-/dados/fotos-orcamentos}
      # Fuso de Brasília. Existe só aqui — nunca no serviço postgres (ver 02-MODELO-DE-DADOS.md §0).
      TZ: ${TZ}
    healthcheck:
      # 127.0.0.1 e não `localhost`: dentro do contêiner, `localhost` resolve para ::1 (IPv6),
      # e o servidor do Next escuta em 0.0.0.0 (IPv4). Com `localhost` este teste falha sempre,
      # o contêiner nunca fica `healthy` e o caddy, que depende dele, herda o problema — tudo
      # isso sem nenhuma mensagem de erro que aponte para a causa.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Única porta aberta ao mundo. Termina TLS e renova o certificado sozinho.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - app

  # Nunca fica rodando. Invocado sob demanda: docker compose run --rm ferramentas ...
  ferramentas:
    image: ${IMAGEM_FERRAMENTAS}
    profiles: ["ferramentas"]
    restart: "no"
    environment:
      # Migração precisa do dono do banco (amassa_owner), não do papel restrito da aplicação
      # — é quem cria e altera tabela. O nome da variável no contêiner continua DATABASE_URL
      # (é o que db/migrate.ts e scripts/*.ts leem); só a origem no .env muda.
      DATABASE_URL: ${DATABASE_URL_MIGRACAO}

volumes:
  dados_postgres:
  caddy_dados:
  caddy_config:
